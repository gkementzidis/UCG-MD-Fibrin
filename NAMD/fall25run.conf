#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure 	input/cg-fibrin-psfgen.psf
coordinates	input/cg-fibrin-psfgen.pdb

set temperature    310
set outputname     output/fall25run

firsttimestep      0


#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on
parameters	        input/paramsInit.par
temperature         $temperature

# Force-Field Parameters
exclude             1-2
cutoff              120.0  # RIGHT CUTOFF???
switching           on
switchdist          90.0
pairlistdist        160.0
# hgroupcutoff        0
# dielectric          20.0


# Integrator Parameters
timestep            10.0
nonbondedFreq       1
stepspercycle       20


# Constant Temperature Control
langevin            on
langevinDamping     0.05
langevinTemp        $temperature
# langevinHydrogen    off    

# Output
outputName          $outputname

restartfreq         4000
dcdfreq             4000
xstFreq             4000
outputEnergies      4000
# outputPressure      4000

#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################
# Minimization
minimize            10000
reinitvels $temperature

 run 4000000
